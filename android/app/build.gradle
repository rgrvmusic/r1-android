plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.rgrv.r1'
    compileSdk 33

    defaultConfig {
        applicationId "nl.rgrv.r1"
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared', '-DCMAKE_BUILD_TYPE=Release'
                targets "main"
            }
        }

        ndk { abiFilters 'arm64-v8a' }
    }

    externalNativeBuild {
        cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" }
    }

    sourceSets {
        main {
            // SDL3's Java side (org.libsdl.app.SDLActivity).
            java.srcDirs += ['../../../rfx/shared/lib/SDL3/android-project/app/src/main/java']
        }
    }

    buildTypes {
        release { minifyEnabled false }
        debug   { }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies { }
